<body>

    <header>

        <h2>VINORA|134</h2>

        <nav>
            <a href="index.html">Início</a>
            <a href="index.html#vinhos">Vinhos</a>
            <a href="index.html#contato">Contato</a>
        </nav>
<button id="btnCarrinho" class="btn-carrinho">
    🛒 <span id="contadorCarrinho">0</span>
</button> 

    </header>


<div id="carrinho" class="carrinho">
    <div class="carrinho-header">
        <h2>Seu Carrinho</h2>
        <button id="fecharCarrinho">✕</button>
    </div>

    <div id="itensCarrinho">
        <p>Seu carrinho está vazio.</p>
    </div>

    <div class="carrinho-footer">
        <strong>Total: <span id="totalCarrinho">R$ 0,00</span></strong>
        <button id="finalizarPedido" class="btn-finalizar">
            Finalizar pedido
        </button>
    </div>
</div>


    <section class="titulo">

        <h1>Vinhos Brancos</h1>

        <p>
            Leves, frescos e elegantes para brindar bons momentos.
        </p>

    </section>


    <section class="produtos">


        <div class="produto" data-nome="Miolo reserva" data-preco="59.90">

            <img src="Imagens/miolo reserva.jpg" alt="Vinho Miolo">

            <h3>Miolo reserva</h3>

            <p>
                Sauvignon Blanc 2025
            </p>

            <div class="preco">
                R$ 59,90
            </div>

            <button class="btn-adicionar">
                Adicionar ao carrinho
            </button>

        </div>

     <div class="produto" data-nome="Miolo Single" data-preco="79.90">

            <img src="Imagens/miolo single.jpg" alt="Vinho Miolo">

            <h3>Miolo Single</h3>

            <p>
                Riesling Johannisberg Garrafa Nº 01608
            </p>

            <div class="preco">
                R$ 79,90
            </div>

            <button class="btn-adicionar">
                Adicionar ao carrinho
            </button>

        </div>

    </section>

    <script>

const botoesAdicionar = document.querySelectorAll('.btn-adicionar');

const contadorCarrinho = document.getElementById('contadorCarrinho');
const itensCarrinho = document.getElementById('itensCarrinho');
const totalCarrinho = document.getElementById('totalCarrinho');

const btnCarrinho = document.getElementById('btnCarrinho');
const carrinho = document.getElementById('carrinho');
const fecharCarrinho = document.getElementById('fecharCarrinho');

let carrinhoProdutos = [];


// ADICIONAR PRODUTO
botoesAdicionar.forEach(botao => {

    botao.addEventListener('click', function () {

        const produto = botao.closest('.produto');

        const nome = produto.dataset.nome;
        const preco = parseFloat(produto.dataset.preco);

        const produtoExistente = carrinhoProdutos.find(
            item => item.nome === nome
        );

        if (produtoExistente) {

            produtoExistente.quantidade++;

        } else {

            carrinhoProdutos.push({
                nome: nome,
                preco: preco,
                quantidade: 1,
                imagem: produto.querySelector('img').src
            });

        }

        atualizarCarrinho();

        carrinho.classList.add('aberto');

    });

});


// ATUALIZAR CARRINHO
function atualizarCarrinho() {

    itensCarrinho.innerHTML = '';

    let total = 0;
    let quantidadeTotal = 0;

    carrinhoProdutos.forEach((item, index) => {

        total += item.preco * item.quantidade;
        quantidadeTotal += item.quantidade;

        const div = document.createElement('div');

        div.className = 'item-carrinho';

        div.innerHTML = `
            <img src="${item.imagem}" class="imagem-carrinho">

            <div class="info-carrinho">

                <strong>${item.nome}</strong>

                <p>
                    R$ ${item.preco.toFixed(2).replace('.', ',')} cada
                </p>

                <div class="subtotal-carrinho">
                    Subtotal:
                    R$ ${(item.preco * item.quantidade).toFixed(2).replace('.', ',')}
                </div>

                <div class="controles-carrinho">

                    <button onclick="alterarQuantidade(${index}, -1)">
                        −
                    </button>

                    <span>${item.quantidade}</span>

                    <button onclick="alterarQuantidade(${index}, 1)">
                        +
                    </button>

                    <button
                        class="btn-remover"
                        onclick="removerProduto(${index})">
                        Remover
                    </button>

                </div>

            </div>
        `;

        itensCarrinho.appendChild(div);

    });

    contadorCarrinho.textContent = quantidadeTotal;

    totalCarrinho.textContent =
        `R$ ${total.toFixed(2).replace('.', ',')}`;

}


// AUMENTAR / DIMINUIR
function alterarQuantidade(index, valor) {

    carrinhoProdutos[index].quantidade += valor;

    if (carrinhoProdutos[index].quantidade <= 0) {
        carrinhoProdutos.splice(index, 1);
    }

    atualizarCarrinho();

}


// REMOVER
function removerProduto(index) {

    carrinhoProdutos.splice(index, 1);

    atualizarCarrinho();

}


// ABRIR CARRINHO
btnCarrinho.addEventListener('click', function () {

    carrinho.classList.add('aberto');

});


// FECHAR CARRINHO
fecharCarrinho.addEventListener('click', function () {

    carrinho.classList.remove('aberto');

});

const finalizarPedido = document.getElementById('finalizarPedido');

finalizarPedido.addEventListener('click', function () {

    if (carrinhoProdutos.length === 0) {
        alert('Seu carrinho está vazio.');
        return;
    }

    let mensagem = '🍷 *PEDIDO VINORA 134*%0A%0A';

    let total = 0;

    carrinhoProdutos.forEach(function (item) {

        const subtotal = item.preco * item.quantidade;

        total += subtotal;

        mensagem +=
            `${item.quantidade}x ${item.nome} - R$ ${subtotal.toFixed(2).replace('.', ',')}%0A`;
    });

    mensagem +=
        `%0A*TOTAL: R$ ${total.toFixed(2).replace('.', ',')}*`;

    const numeroWhatsApp = '5551999083309';

    const link =
        `https://wa.me/${numeroWhatsApp}?text=${mensagem}`;

    window.open(link, '_blank');

});

</script>
